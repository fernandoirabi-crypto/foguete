<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE | Esporte em Movimento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #111111;
            line-height: 1.4;
        }

        /* Smooth Scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Header Minimalista */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            z-index: 1000;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #111 0%, #333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-menu a {
            text-decoration: none;
            color: #111;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        .nav-menu a:hover {
            opacity: 0.6;
        }

        .nav-icons {
            display: flex;
            gap: 1.5rem;
            cursor: pointer;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #111;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        /* Hero Section - Estilo Nike */
        .hero {
            margin-top: 80px;
            height: 90vh;
            position: relative;
            overflow: hidden;
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-slide.active {
            opacity: 1;
        }

        .hero-content {
            text-align: center;
            color: white;
            z-index: 2;
            position: relative;
        }

        .hero-content h1 {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .hero-btn {
            background: white;
            color: black;
            padding: 1rem 2.5rem;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .hero-btn:hover {
            transform: scale(1.05);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .hero-dots {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: white;
            width: 30px;
            border-radius: 10px;
        }

        /* Seção Produtos */
        .section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 5rem 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 3rem;
            letter-spacing: -0.02em;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 2px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
        }

        .product-image {
            width: 100%;
            height: 400px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            transition: transform 0.3s;
        }

        .product-card:hover .product-image {
            transform: scale(1.02);
        }

        .product-info {
            padding: 1.5rem 0;
        }

        .product-category {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: #111;
        }

        .add-to-cart {
            background: #111;
            color: white;
            border: none;
            padding: 0.8rem;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .add-to-cart:hover {
            background: #333;
        }

        /* Carrinho Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.05);
            transition: right 0.3s;
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid #eee;
        }

        .cart-total {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: #111;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        /* Modal Finalização */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }
            
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
            
            .nav-menu {
                display: none;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .section {
                padding: 3rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">PULSE</div>
            <ul class="nav-menu">
                <li><a href="#">INÍCIO</a></li>
                <li><a href="#produtos">LANÇAMENTOS</a></li>
                <li><a href="#produtos">MASSA</a></li>
                <li><a href="#produtos">CORRIDA</a></li>
            </ul>
            <div class="nav-icons">
                <div class="cart-icon" onclick="toggleCart()">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Slider -->
    <div class="hero">
        <div class="hero-slide active">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1200" alt="Nike" class="hero-bg">
            <div class="hero-content">
                <h1>JUST DO IT</h1>
                <p>Novos lançamentos disponíveis</p>
                <button class="hero-btn" onclick="document.getElementById('produtos').scrollIntoView({behavior: 'smooth'})">COMPRAR AGORA</button>
            </div>
        </div>
        <div class="hero-slide">
            <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=1200" alt="Esporte" class="hero-bg">
            <div class="hero-content">
                <h1>FITNESS</h1>
                <p>Alcance seus limites</p>
                <button class="hero-btn">VER COLEÇÃO</button>
            </div>
        </div>
        <div class="hero-slide">
            <img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=1200" alt="Corrida" class="hero-bg">
            <div class="hero-content">
                <h1>CORRIDA</h1>
                <p>Tecnologia e performance</p>
                <button class="hero-btn">EXPLORAR</button>
            </div>
        </div>
        <div class="hero-dots">
            <div class="dot active" onclick="currentSlide(0)"></div>
            <div class="dot" onclick="currentSlide(1)"></div>
            <div class="dot" onclick="currentSlide(2)"></div>
        </div>
    </div>

    <!-- Produtos -->
    <div class="section" id="produtos">
        <h2 class="section-title">LANÇAMENTOS</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Carrinho -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>SEU CARRINHO</h3>
            <button onclick="toggleCart()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">✕</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total" id="cartTotal">R$ 0,00</div>
            <button class="checkout-btn" onclick="openCheckout()">FINALIZAR</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h2>Finalizar Pedido</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <input type="text" placeholder="Nome completo" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="text" placeholder="Endereço" required>
                </div>
                <button type="submit" class="checkout-btn">CONFIRMAR</button>
            </form>
        </div>
    </div>

    <script>
        // Produtos
        const products = [
            { id: 1, name: "Air Max Pulse", category: "CASUAL", price: 799.90, emoji: "👟", image: "bg" },
            { id: 2, name: "Pro Run 3000", category: "CORRIDA", price: 599.90, emoji: "🏃", image: "bg" },
            { id: 3, name: "Gym Elite", category: "TREINO", price: 449.90, emoji: "💪", image: "bg" },
            { id: 4, name: "Court Legacy", category: "BASQUETE", price: 499.90, emoji: "🏀", image: "bg" },
            { id: 5, name: "Yoga Flow", category: "YOGA", price: 299.90, emoji: "🧘", image: "bg" },
            { id: 6, name: "Trail Max", category: "TRILHA", price: 699.90, emoji: "⛰️", image: "bg" }
        ];

        let cart = JSON.parse(localStorage.getItem('pulseCart')) || [];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image" style="background: linear-gradient(135deg, #1a1a1a 0%, #333 100%); color: white; font-size: 4rem;">
                        ${product.emoji}
                    </div>
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">R$ ${product.price.toFixed(2)}</div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">
                        ADICIONAR
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            
            if(existing) {
                existing.quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }
            
            saveCart();
            updateCartUI();
            showNotification(`${product.name} adicionado`);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartUI();
        }

        function updateQuantity(id, change) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.quantity += change;
                if(item.quantity <= 0) removeFromCart(id);
                else saveCart();
                updateCartUI();
            }
        }

        function saveCart() {
            localStorage.setItem('pulseCart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').innerText = count;
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalSpan = document.getElementById('cartTotal');
            
            if(cart.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 2rem;">Carrinho vazio</p>';
                totalSpan.innerText = 'R$ 0,00';
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        R$ ${item.price.toFixed(2)}
                    </div>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <button onclick="updateQuantity(${item.id}, -1)" style="width: 30px;">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" style="width: 30px;">+</button>
                        <button onclick="removeFromCart(${item.id})" style="background: none; border: none; font-size: 1.2rem;">✕</button>
                    </div>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            totalSpan.innerText = `R$ ${total.toFixed(2)}`;
            updateCartCount();
        }

        let slideIndex = 0;

        function showSlide(n) {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.dot');
            
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            slideIndex = (n + slides.length) % slides.length;
            slides[slideIndex].classList.add('active');
            dots[slideIndex].classList.add('active');
        }

        function currentSlide(n) {
            showSlide(n);
        }

        function nextSlide() {
            showSlide(slideIndex + 1);
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function openCheckout() {
            if(cart.length === 0) {
                alert('Carrinho vazio');
                return;
            }
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function showNotification(msg) {
            const notif = document.createElement('div');
            notif.textContent = msg;
            notif.style.cssText = `position: fixed; bottom: 20px; right: 20px; background: #111; color: white; padding: 1rem; z-index: 4000;`;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        // Auto slide
        setInterval(nextSlide, 5000);

        // Checkout
        document.getElementById('checkoutForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Pedido finalizado com sucesso!');
            cart = [];
            saveCart();
            updateCartUI();
            document.getElementById('checkoutModal').style.display = 'none';
            toggleCart();
        });

        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
